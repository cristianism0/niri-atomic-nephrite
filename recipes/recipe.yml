---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: niri-atomic-nephrite
description: Fedora Atomic with Niri Window Manager and Noctalia Shell.
base-image: quay.io/fedora/fedora-bootc
image-version: 45

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    # RPM Fusion is not being used
    # repos:
    #   - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
    #   - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
    optfix:
      - /opt
    install:
      - NetworkManager
      - NetworkManager-wifi
      - NetworkManager-tui
      - nmtui
      - iw
      - upower
      - power-profiles-daemon
      - linux-firmware
      - wpa_supplicant
      - bluez
      - flatpak
      - toolbox
      - nautilus
      - niri
      - noctalia
      - alacritty
      - fuzzel
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - mate-polkit
      - greetd
      - tuigreet
      - wl-clipboard
      - brightnessctl
      - playerctl
      - pipewire
      - pipewire-pulseaudio
      - wireplumber
      - dejavu-sans-fonts
      - google-noto-sans-fonts
      - google-noto-emoji-fonts
      - mesa-dri-drivers
      - mesa-vulkan-drivers
      - libva-utils
      - plymouth
      - plymouth-theme-spinner
      - xdg-user-dirs
      - which
      - zsh
      - qt6-qtwayland
      - qt5-qtwayland
      - gvfs
      - vim
      - git
      - glibc-all-langpacks
      - gcc
      - adwaita-icon-theme
      - ffmpeg-free
      - tmux
      - xwayland-satellite
      - ddcutil
      - libheif

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe

  - type: systemd
    system:
      enabled:
        - greetd.service
        - NetworkManager.service
        - bluetooth.service

  - type: kargs
    kargs:
      - quiet
      - splash
      - rd.udev.log_level=3

  - type: initramfs

  - type: script
    snippets:
      - "systemctl set-default graphical.target"
      - "plymouth-set-default-theme spinner"

  - type: containerfile
    snippets:
      - RUN bootc container lint
  - type: signing
