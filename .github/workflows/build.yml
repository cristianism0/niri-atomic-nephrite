name: build bootc image

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Custom Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load build.env
        run: |
          set -a
          source ./build.env
          set +a
          for key in FEDORA_VERSION BASE_IMAGE IMAGE_NAME IMAGE_TAG; do
            value="${!key}"
            if [ -z "${value}" ]; then
              echo "::error::Variável ${key} ausente ou vazia em build.env"
              exit 1
            fi
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.IMAGE_TAG }} ${{ github.sha }}
          containerfiles: ./Containerfile
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.push.outputs.digest }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::Digest vazio; recusando assinar referência ambígua"
            exit 1
          fi
          echo "${TOKEN}" | cosign login ghcr.io -u "${ACTOR}" --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
